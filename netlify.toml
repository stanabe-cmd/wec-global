# Netlify の公開設定(ここに書いた内容が Netlify 側の設定より優先される)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 本番公開前なので検索エンジンに載せない設定。
# 本番ドメイン(global.wecnrt.co.jp 等)で公開するときに、この [[headers]] ブロックを削除する。
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
